<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Local-first inventory and product-costing app for small leather shops. Materials, stock levels, recipes, margins. Your data stays in your browser.">
<title>Leather Inventory</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="app-header">
  <h1>🧵 Leather Inventory</h1>
  <p>Materials · costing · stock — your data stays on this device</p>
</header>

<nav class="tabs" id="tabs" aria-label="Sections">
  <button data-view="dashboard" class="active">Dashboard</button>
  <button data-view="materials">Materials</button>
  <button data-view="products">Products</button>
  <button data-view="lowstock">Low Stock <span class="pill zero" id="low-pill">0</span></button>
  <button data-view="data">Data</button>
</nav>

<main>
  <section class="view active" id="view-dashboard" aria-label="Dashboard"></section>
  <section class="view" id="view-materials" aria-label="Materials"></section>
  <section class="view" id="view-products" aria-label="Products"></section>
  <section class="view" id="view-lowstock" aria-label="Low stock"></section>
  <section class="view" id="view-data" aria-label="Data and backup"></section>
</main>

<div id="modal-root"></div>
<div id="toast-root"></div>

<footer class="app-footer">
  <p>Local-first: everything you enter lives in this browser's storage. Export a backup regularly — see the Data tab.</p>
  <p>Recipes marked <span class="badge est">estimate</span> need a bench check before you trust the margin.</p>
</footer>

<script src="demo-data.js"></script>
<script src="app.js"></script>
</body>
</html>
